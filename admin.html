<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理員後台</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .subtitle { color: #9ca3af; font-size: 13px; margin: 0 0 24px; }

  .card {
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h3 { margin: 0 0 14px; font-size: 15px; }
  .card h3 .count { color: #9ca3af; font-weight: normal; font-size: 13px; margin-left: 6px; }

  input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f1115;
    color: #eee;
    font-family: inherit;
    font-size: 14px;
  }
  input::placeholder { color: #6b7280; }
  input:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }

  button {
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  button.secondary { background: #333; }
  button.danger { background: #dc2626; }
  button.outline { background: transparent; border: 1px solid #3b82f6; color: #bfdbfe; }
  button.small { padding: 5px 11px; font-size: 12px; margin-left: 6px; }
  button.block { width: 100%; }

  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .msg.error { color: #f87171; }
  .msg.ok { color: #4ade80; }
  .hint { font-size: 12px; color: #9ca3af; margin: -4px 0 14px; }

  /* 表單橫排（窄螢幕自動折行） */
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .form-row input { flex: 1 1 180px; width: auto; margin: 0 0 4px; }
  .form-row button { flex: 0 0 auto; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left;
    padding: 0 8px 8px;
    border-bottom: 1px solid #2a2e38;
    color: #9ca3af;
    font-weight: normal;
    font-size: 12px;
  }
  td { padding: 10px 8px; border-bottom: 1px solid #2a2e38; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.name { word-break: break-all; }
  td.dim { color: #9ca3af; white-space: nowrap; }
  td.act { text-align: right; white-space: nowrap; }
  .empty td { color: #9ca3af; font-size: 13px; text-align: center; padding: 18px 8px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    background: #23272f;
    color: #9ca3af;
  }
  .badge.admin { background: #1e3a5f; color: #93c5fd; }

  /* 未登入的鎖住清單 */
  .locked td { color: #4b5563; }
  .locked .name { letter-spacing: 1px; }
  .locked .lock { color: #d8a443; margin-right: 8px; }

  /* 頂端狀態列 */
  .top-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top-line p { margin: 0; font-size: 14px; }
  .top-line .idle { display: block; color: #9ca3af; font-size: 12px; margin-top: 4px; }
  .top-line .idle.warn { color: #fbbf24; }

  /* 分頁 */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    background: #1a1d24;
    border: 1px solid #2a2e38;
    color: #9ca3af;
    font-weight: normal;
  }
  .tab[aria-selected="true"] { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: bold; }

  [hidden] { display: none !important; }

  @media (max-width: 520px) {
    th:nth-child(3), td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<h1>🛠️ 管理員後台</h1>
<p class="subtitle" id="subtitle">需要管理員帳號才能瀏覽</p>

<!-- ============ 未登入 ============ -->
<div id="view-locked">
  <div class="card">
    <h3>🔒 檔案清單（需登入）</h3>
    <table class="locked">
      <thead>
        <tr><th>名稱</th><th>擁有者</th><th>時間</th><th></th></tr>
      </thead>
      <tbody id="locked-rows"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>管理員登入</h3>
    <input id="login-username" placeholder="帳號" autocomplete="username" />
    <input id="login-password" type="password" placeholder="密碼" autocomplete="current-password" />
    <button class="block" onclick="login()">登入</button>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<!-- ============ 初次安裝 ============ -->
<div id="view-setup" hidden>
  <div class="card">
    <h3>初次安裝 — 建立第一組管理員</h3>
    <p class="hint">資料庫目前沒有任何帳號。建立第一組管理員之後，這個畫面就會關閉，日後所有帳號一律由後台新增。</p>
    <input id="setup-username" placeholder="管理員帳號" autocomplete="username" />
    <input id="setup-password" type="password" placeholder="密碼（至少 6 碼）" autocomplete="new-password" />
    <button class="block" onclick="runSetup()">建立管理員</button>
    <div id="setup-msg" class="msg"></div>
  </div>
</div>

<!-- ============ 已登入 ============ -->
<div id="view-admin" hidden>
  <div class="card top-line">
    <p>已登入：<strong id="current-user"></strong>
      <span class="idle" id="idle-note">閒置 <span id="idle-countdown">300</span> 秒後自動登出</span>
    </p>
    <button class="secondary small" onclick="logout()">登出</button>
  </div>

  <div class="tabs">
    <button class="tab" id="tab-files" role="tab" aria-selected="true" onclick="switchTab('files')">檔案</button>
    <button class="tab" id="tab-users" role="tab" aria-selected="false" onclick="switchTab('users')">使用者</button>
  </div>

  <!-- 檔案分頁 -->
  <div id="pane-files">
    <div class="card">
      <h3>全部檔案<span class="count" id="files-count"></span></h3>
      <table>
        <thead>
          <tr><th>檔名</th><th>擁有者</th><th>上傳時間</th><th></th></tr>
        </thead>
        <tbody id="files-rows"></tbody>
      </table>
    </div>
  </div>

  <!-- 使用者分頁 -->
  <div id="pane-users" hidden>
    <div class="card">
      <h3>新增一般使用者</h3>
      <p class="hint">先設一組起始密碼交給對方，使用者登入首頁後可以自行變更密碼。</p>
      <div class="form-row">
        <input id="new-user-username" placeholder="帳號" autocomplete="off" />
        <input id="new-user-password" type="password" placeholder="起始密碼（至少 6 碼）" autocomplete="new-password" />
        <button onclick="createUser()">新增使用者</button>
      </div>
      <div id="create-user-msg" class="msg"></div>
    </div>

    <div class="card">
      <h3>新增管理員</h3>
      <div class="form-row">
        <input id="new-admin-username" placeholder="帳號" autocomplete="off" />
        <input id="new-admin-password" type="password" placeholder="密碼（至少 6 碼）" autocomplete="new-password" />
        <button class="outline" onclick="createAdmin()">新增管理員</button>
      </div>
      <div id="create-admin-msg" class="msg"></div>
    </div>

    <div class="card">
      <h3>全部帳號<span class="count" id="users-count"></span></h3>
      <table>
        <thead>
          <tr><th>帳號</th><th>身分</th><th>編號</th><th></th></tr>
        </thead>
        <tbody id="users-rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* 未登入時顯示的佔位清單。
   寫死在前端，不會向伺服器索取，因此不會洩漏任何真實檔名。 */
const LOCKED_ROWS = [
  '████████████.zip',
  '██████.pdf',
  '█████████.png',
  '███████████.csv',
  '████.txt',
];

function renderLockedRows() {
  const tbody = document.getElementById('locked-rows');
  tbody.innerHTML = '';
  LOCKED_ROWS.forEach((name) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="name"><span class="lock">🔒</span>${name}</td>` +
      `<td>████</td><td>————</td><td class="act">未授權</td>`;
    tbody.appendChild(tr);
  });
}

function showView(which) {
  document.getElementById('view-locked').hidden = which !== 'locked';
  document.getElementById('view-setup').hidden = which !== 'setup';
  document.getElementById('view-admin').hidden = which !== 'admin';
}

function switchTab(which) {
  document.getElementById('pane-files').hidden = which !== 'files';
  document.getElementById('pane-users').hidden = which !== 'users';
  document.getElementById('tab-files').setAttribute('aria-selected', which === 'files');
  document.getElementById('tab-users').setAttribute('aria-selected', which === 'users');
}

function say(id, text, kind) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg' + (kind ? ' ' + kind : '');
}

/* ---------------- 初次安裝 ---------------- */

async function checkSetup() {
  const res = await fetch('/api/setup');
  if (!res.ok) return false;
  const data = await res.json();
  if (!data.needsSetup) return false;

  showView('setup');
  document.getElementById('subtitle').textContent = '尚未初始化，請先建立管理員帳號';
  return true;
}

async function runSetup() {
  const username = document.getElementById('setup-username').value.trim();
  const password = document.getElementById('setup-password').value;
  say('setup-msg', '');

  const res = await fetch('/api/setup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();

  if (!res.ok) return say('setup-msg', data.error || '建立失敗', 'error');

  showLocked('管理員帳號已建立，請用它登入');
  document.getElementById('login-username').value = username;
  document.getElementById('login-password').focus();
}

/* ---------------- 登入 / 登出 ---------------- */

function showLocked(message, kind) {
  showView('locked');
  document.getElementById('subtitle').textContent = '需要管理員帳號才能瀏覽';
  say('login-msg', message || '', message ? (kind || 'ok') : '');
}

async function login() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  say('login-msg', '');

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  if (!res.ok) {
    const data = await res.json();
    return say('login-msg', data.error || '登入失敗', 'error');
  }

  const check = await fetch('/api/admin/users');
  if (!check.ok) {
    await fetch('/api/logout', { method: 'POST' });
    return say('login-msg', '此帳號沒有管理員權限', 'error');
  }

  document.getElementById('login-password').value = '';
  enterAdmin(username);
}

function enterAdmin(username) {
  showView('admin');
  switchTab('files');
  document.getElementById('subtitle').textContent = '管理所有帳號與檔案';
  document.getElementById('current-user').textContent = username;
  loadUsers();
  loadFiles();
  startIdleTimer();
}

/* ---------------- 300 秒閒置自動登出 ---------------- */

const IDLE_LIMIT_MS = 300 * 1000;
const IDLE_EVENTS = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
let lastActivityAt = Date.now();
let idleCheckInterval = null;

function updateIdleCountdown() {
  const el = document.getElementById('idle-countdown');
  if (!el) return;
  const remaining = Math.max(0, Math.ceil((IDLE_LIMIT_MS - (Date.now() - lastActivityAt)) / 1000));
  el.textContent = remaining;
  document.getElementById('idle-note').classList.toggle('warn', remaining <= 60);
}

function markActivity() {
  lastActivityAt = Date.now();
  updateIdleCountdown();
}

function startIdleTimer() {
  markActivity();
  IDLE_EVENTS.forEach((e) => document.addEventListener(e, markActivity));
  if (idleCheckInterval) clearInterval(idleCheckInterval);
  idleCheckInterval = setInterval(() => {
    updateIdleCountdown();
    if (Date.now() - lastActivityAt > IDLE_LIMIT_MS) {
      logout('閒置超過 5 分鐘，已自動登出，請重新登入');
    }
  }, 1000);
}

function stopIdleTimer() {
  if (idleCheckInterval) clearInterval(idleCheckInterval);
  idleCheckInterval = null;
  IDLE_EVENTS.forEach((e) => document.removeEventListener(e, markActivity));
}

async function logout(message) {
  stopIdleTimer();
  await fetch('/api/logout', { method: 'POST' });
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  showLocked(message, '');
}

/* ---------------- 讀取清單 ---------------- */

function sessionExpired(res) {
  if (res.status === 401 || res.status === 403) {
    stopIdleTimer();
    showLocked('登入已過期，請重新登入', 'error');
    return true;
  }
  return false;
}

function emptyRow(tbody, colspan, text) {
  const tr = document.createElement('tr');
  tr.className = 'empty';
  tr.innerHTML = `<td colspan="${colspan}">${text}</td>`;
  tbody.appendChild(tr);
}

async function loadFiles() {
  const res = await fetch('/api/admin/files');
  if (sessionExpired(res)) return;
  const data = await res.json();
  const tbody = document.getElementById('files-rows');
  tbody.innerHTML = '';
  document.getElementById('files-count').textContent = `（${data.files.length}）`;

  if (!data.files.length) return emptyRow(tbody, 4, '目前沒有任何檔案');

  data.files.forEach((f) => {
    const tr = document.createElement('tr');

    const name = document.createElement('td');
    name.className = 'name';
    name.textContent = f.filename;

    const owner = document.createElement('td');
    owner.className = 'dim';
    owner.textContent = f.owner;

    const time = document.createElement('td');
    time.className = 'dim';
    time.textContent = f.created_at || '—';

    const act = document.createElement('td');
    act.className = 'act';
    const del = document.createElement('button');
    del.className = 'danger small';
    del.textContent = '刪除';
    del.onclick = () => deleteFile(f.id, f.filename);
    act.appendChild(del);

    tr.append(name, owner, time, act);
    tbody.appendChild(tr);
  });
}

async function loadUsers() {
  const res = await fetch('/api/admin/users');
  if (sessionExpired(res)) return;
  const data = await res.json();
  const tbody = document.getElementById('users-rows');
  tbody.innerHTML = '';
  document.getElementById('users-count').textContent = `（${data.users.length}）`;

  if (!data.users.length) return emptyRow(tbody, 4, '沒有任何帳號');

  data.users.forEach((u) => {
    const tr = document.createElement('tr');

    const name = document.createElement('td');
    name.className = 'name';
    name.textContent = u.username;

    const role = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge' + (u.is_admin ? ' admin' : '');
    badge.textContent = u.is_admin ? '管理員' : '一般使用者';
    role.appendChild(badge);

    const id = document.createElement('td');
    id.className = 'dim';
    id.textContent = '#' + u.id;

    const act = document.createElement('td');
    act.className = 'act';

    const reset = document.createElement('button');
    reset.className = 'secondary small';
    reset.textContent = '重置密碼';
    reset.onclick = () => resetPassword(u.id, u.username);
    act.appendChild(reset);

    const del = document.createElement('button');
    del.className = 'danger small';
    del.textContent = '刪除';
    del.onclick = () => deleteUser(u.id, u.username);
    act.appendChild(del);

    tr.append(name, role, id, act);
    tbody.appendChild(tr);
  });
}

/* ---------------- 建立帳號 ---------------- */

async function createAccount(endpoint, userInputId, passInputId, msgId, okText) {
  const username = document.getElementById(userInputId).value.trim();
  const password = document.getElementById(passInputId).value;
  say(msgId, '');

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  if (sessionExpired(res)) return;
  const data = await res.json();

  if (!res.ok) return say(msgId, data.error || '建立失敗', 'error');

  say(msgId, okText, 'ok');
  document.getElementById(userInputId).value = '';
  document.getElementById(passInputId).value = '';
  loadUsers();
}

function createUser() {
  createAccount('/api/admin/create-user', 'new-user-username', 'new-user-password',
    'create-user-msg', '使用者帳號已建立');
}

function createAdmin() {
  createAccount('/api/admin/create-admin', 'new-admin-username', 'new-admin-password',
    'create-admin-msg', '管理員帳號已建立');
}

/* ---------------- 帳號 / 檔案操作 ---------------- */

async function resetPassword(id, username) {
  if (!confirm(`要重置「${username}」的密碼嗎？系統會產生一組新密碼。`)) return;

  const res = await fetch('/api/admin/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  if (sessionExpired(res)) return;
  const data = await res.json();

  if (!res.ok) return alert(data.error || '重置失敗');

  alert(`已重置「${data.username}」的密碼，新密碼為：\n\n${data.newPassword}\n\n` +
        `請複製後轉交給使用者，此密碼之後不會再顯示。使用者登入後可自行變更密碼。`);
}

async function deleteUser(id, username) {
  if (!confirm(`要刪除「${username}」嗎？這個帳號的所有檔案也會一併刪除。`)) return;

  const res = await fetch('/api/admin/delete-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  if (sessionExpired(res)) return;
  const data = await res.json();

  if (!res.ok) return alert(data.error || '刪除失敗');
  loadUsers();
  loadFiles();
}

async function deleteFile(id, filename) {
  if (!confirm(`要刪除「${filename}」嗎？`)) return;

  const res = await fetch('/api/admin/delete-file', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  if (sessionExpired(res)) return;
  loadFiles();
}

/* ---------------- 啟動 ---------------- */

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const id = document.activeElement && document.activeElement.id;
  if (id === 'login-username' || id === 'login-password') login();
  if (id === 'setup-username' || id === 'setup-password') runSetup();
});

(async () => {
  renderLockedRows();

  try {
    const check = await fetch('/api/admin/users');
    if (check.ok) {
      const me = await fetch('/api/me');
      const name = me.ok ? (await me.json()).username : '管理員';
      return enterAdmin(name);
    }

    if (await checkSetup()) return;
    showLocked();
  } catch {
    showLocked('無法連線到伺服器，請重新整理頁面', 'error');
  }
})();
</script>

</body>
</html>

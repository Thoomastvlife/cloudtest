<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理員後台</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 22px; margin-bottom: 24px; }
  h3 { margin-top: 0; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f1115;
    color: #eee;
  }
  button {
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  button.danger { background: #dc2626; padding: 4px 10px; font-size: 12px; }
  button.secondary { background: #333; }
  button.small { padding: 4px 10px; font-size: 12px; margin-left: 6px; }
  #login-box button { width: 100%; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .msg.error { color: #f87171; }
  .msg.ok { color: #4ade80; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #2a2e38; }
  #app-section { display: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  .idle-note { font-size: 12px; color: #9ca3af; margin: 0; }
</style>
</head>
<body>

<h1>🛠️ 管理員後台</h1>

<div id="login-box" class="card">
  <h3>管理員登入</h3>
  <input id="login-username" placeholder="帳號" />
  <input id="login-password" type="password" placeholder="密碼" />
  <button onclick="login()">登入</button>
  <div id="login-msg" class="msg"></div>
</div>

<div id="app-section">
  <div class="card top-bar">
    <p class="idle-note">閒置超過 5 分鐘（300 秒）將自動登出</p>
    <button class="secondary small" onclick="logout()">登出</button>
  </div>

  <div class="card">
    <h3>新增管理員</h3>
    <input id="new-admin-username" placeholder="帳號" />
    <input id="new-admin-password" type="password" placeholder="密碼（至少 6 碼）" />
    <button onclick="createAdmin()">新增管理員</button>
    <div id="create-admin-msg" class="msg"></div>
  </div>

  <div class="card">
    <h3>所有使用者</h3>
    <table id="users-table">
      <thead><tr><th>帳號</th><th>管理員</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h3>所有檔案</h3>
    <table id="files-table">
      <thead><tr><th>擁有者</th><th>檔名</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
async function login() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const msg = document.getElementById('login-msg');
  msg.textContent = '';

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  if (!res.ok) {
    const data = await res.json();
    msg.textContent = data.error || '登入失敗';
    msg.className = 'msg error';
    return;
  }

  const check = await fetch('/api/admin/users');
  if (!check.ok) {
    msg.textContent = '此帳號沒有管理員權限';
    msg.className = 'msg error';
    return;
  }

  document.getElementById('login-box').style.display = 'none';
  document.getElementById('app-section').style.display = 'block';
  loadUsers();
  loadFiles();
  startIdleTimer();
}

// ---------- 300 秒（5 分鐘）閒置自動登出 ----------
const IDLE_LIMIT_MS = 300 * 1000;
let lastActivityAt = Date.now();
let idleCheckInterval = null;

function markActivity() {
  lastActivityAt = Date.now();
}

function startIdleTimer() {
  markActivity();
  ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach((evt) => {
    document.addEventListener(evt, markActivity);
  });
  if (idleCheckInterval) clearInterval(idleCheckInterval);
  idleCheckInterval = setInterval(() => {
    if (Date.now() - lastActivityAt > IDLE_LIMIT_MS) {
      stopIdleTimer();
      logout('閒置超過 5 分鐘，已自動登出，請重新登入');
    }
  }, 1000);
}

function stopIdleTimer() {
  if (idleCheckInterval) clearInterval(idleCheckInterval);
  idleCheckInterval = null;
  ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach((evt) => {
    document.removeEventListener(evt, markActivity);
  });
}

async function logout(message) {
  stopIdleTimer();
  await fetch('/api/logout', { method: 'POST' });
  document.getElementById('app-section').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  const msg = document.getElementById('login-msg');
  if (message) {
    msg.textContent = message;
    msg.className = 'msg';
  } else {
    msg.textContent = '';
  }
}

async function createAdmin() {
  const username = document.getElementById('new-admin-username').value;
  const password = document.getElementById('new-admin-password').value;
  const msg = document.getElementById('create-admin-msg');
  msg.textContent = '';

  const res = await fetch('/api/admin/create-admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();

  if (res.ok) {
    msg.textContent = '管理員帳號建立成功';
    msg.className = 'msg ok';
    document.getElementById('new-admin-username').value = '';
    document.getElementById('new-admin-password').value = '';
    loadUsers();
  } else {
    msg.textContent = data.error || '建立失敗';
    msg.className = 'msg error';
  }
}

async function resetPassword(id, username) {
  if (!confirm(`確定要重置「${username}」的密碼嗎？系統會產生一組新密碼。`)) return;

  const res = await fetch('/api/admin/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const data = await res.json();

  if (!res.ok) {
    alert(data.error || '重置失敗');
    return;
  }

  alert(`已重置「${data.username}」的密碼，新密碼為：\n\n${data.newPassword}\n\n請自行複製並轉交給使用者，此密碼之後不會再顯示。`);
}

async function loadUsers() {
  const res = await fetch('/api/admin/users');
  const data = await res.json();
  const tbody = document.querySelector('#users-table tbody');
  tbody.innerHTML = '';

  data.users.forEach((u) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${u.username}</td><td>${u.is_admin ? '是' : '否'}</td>`;
    const td = document.createElement('td');

    const resetBtn = document.createElement('button');
    resetBtn.className = 'small secondary';
    resetBtn.textContent = '重置密碼';
    resetBtn.onclick = () => resetPassword(u.id, u.username);
    td.appendChild(resetBtn);

    const btn = document.createElement('button');
    btn.className = 'danger small';
    btn.textContent = '刪除';
    btn.onclick = () => deleteUser(u.id);
    td.appendChild(btn);

    tr.appendChild(td);
    tbody.appendChild(tr);
  });
}

async function loadFiles() {
  const res = await fetch('/api/admin/files');
  const data = await res.json();
  const tbody = document.querySelector('#files-table tbody');
  tbody.innerHTML = '';

  data.files.forEach((f) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${f.owner}</td><td>${f.filename}</td>`;
    const td = document.createElement('td');
    const btn = document.createElement('button');
    btn.className = 'danger';
    btn.textContent = '刪除';
    btn.onclick = () => deleteFile(f.id);
    td.appendChild(btn);
    tr.appendChild(td);
    tbody.appendChild(tr);
  });
}

async function deleteUser(id) {
  if (!confirm('確定要刪除這個使用者？他的所有檔案也會一併刪除。')) return;
  const res = await fetch('/api/admin/delete-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const data = await res.json();
  if (!res.ok) return alert(data.error || '刪除失敗');
  loadUsers();
  loadFiles();
}

async function deleteFile(id) {
  if (!confirm('確定要刪除這個檔案？')) return;
  await fetch('/api/admin/delete-file', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  loadFiles();
}
</script>

</body>
</html>

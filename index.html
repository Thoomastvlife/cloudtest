<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>臨時檔案庫</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 22px; margin-bottom: 24px; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h3 { margin-top: 0; }
  input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f1115;
    color: #eee;
  }
  input:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }
  button {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 4px;
  }
  button.secondary { background: #333; }
  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .msg.error { color: #f87171; }
  .msg.ok { color: #4ade80; }
  .hint { font-size: 12px; color: #9ca3af; margin: -4px 0 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #2a2e38;
    font-size: 14px;
  }
  li button { width: auto; padding: 4px 10px; font-size: 12px; margin-left: 6px; }
  li .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  li .actions { display: flex; flex-shrink: 0; }
  .empty { color: #9ca3af; font-size: 13px; padding: 8px 0; }
  button.danger { background: #dc2626; }
  button.outline { background: transparent; border: 1px solid #3b82f6; }
  #app-section { display: none; }
  .top-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top-line p { margin: 0; }
  .idle { display: block; color: #9ca3af; font-size: 12px; margin-top: 4px; }
  .idle.warn { color: #fbbf24; }
  .top-line button { width: auto; padding: 4px 12px; margin: 0; }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 20px;
    width: 90%;
    max-width: 420px;
  }
  .modal-box h3 { margin-top: 0; }
  .modal-box input { font-size: 12px; background: #0f1115; }
</style>
</head>
<body>

<h1>📦 臨時檔案庫</h1>

<div id="auth-section" class="card">
  <h3>登入</h3>
  <input id="login-username" placeholder="帳號" autocomplete="username" />
  <input id="login-password" type="password" placeholder="密碼" autocomplete="current-password" />
  <button onclick="login()">登入</button>
  <div id="login-msg" class="msg"></div>
  <p class="hint">帳號由管理員建立。需要帳號或忘記密碼，請聯絡管理員。</p>
</div>

<div id="app-section">
  <div class="card top-line">
    <p>已登入：<strong id="current-user"></strong>
      <span class="idle" id="idle-note">閒置 <span id="idle-countdown">300</span> 秒後自動登出</span>
    </p>
    <button class="secondary" onclick="logout()">登出</button>
  </div>

  <div class="card">
    <h3>上傳檔案</h3>
    <input id="file-input" type="file" />
    <button onclick="uploadFile()">上傳</button>
    <div id="upload-msg" class="msg"></div>
  </div>

  <div class="card">
    <h3>我的檔案</h3>
    <ul id="file-list"></ul>
  </div>

  <div class="card">
    <h3>變更密碼</h3>
    <input id="old-password" type="password" placeholder="目前密碼" autocomplete="current-password" />
    <input id="new-password" type="password" placeholder="新密碼（至少 6 碼）" autocomplete="new-password" />
    <input id="new-password2" type="password" placeholder="再輸入一次新密碼" autocomplete="new-password" />
    <button onclick="changePassword()">變更密碼</button>
    <div id="change-password-msg" class="msg"></div>
  </div>
</div>

<div id="share-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>🔗 公開分享連結</h3>
    <p class="hint">任何拿到這個連結的人都可以下載此檔案，連結將在 24 小時後自動失效。</p>
    <input id="share-link-input" readonly />
    <div id="share-expire-msg" class="msg"></div>
    <button onclick="copyShareLink()">複製連結</button>
    <button class="secondary" onclick="closeShareModal()">關閉</button>
  </div>
</div>

<script>
function showLogin(message) {
  stopIdleTimer();
  document.getElementById('app-section').style.display = 'none';
  document.getElementById('auth-section').style.display = 'block';
  const msg = document.getElementById('login-msg');
  msg.textContent = message || '';
  msg.className = 'msg';
}

function showApp(username) {
  document.getElementById('auth-section').style.display = 'none';
  document.getElementById('app-section').style.display = 'block';
  document.getElementById('current-user').textContent = username;
  loadFiles();
  startIdleTimer();
}

/* ---------------- 300 秒閒置自動登出 ----------------
   5 分鐘內沒有任何滑鼠、鍵盤或觸控操作就自動登出。
   剩下 60 秒時倒數會轉成黃色提醒。                     */

const IDLE_LIMIT_MS = 300 * 1000;
const IDLE_EVENTS = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
let lastActivityAt = Date.now();
let idleCheckInterval = null;

function updateIdleCountdown() {
  const el = document.getElementById('idle-countdown');
  if (!el) return;
  const remaining = Math.max(0, Math.ceil((IDLE_LIMIT_MS - (Date.now() - lastActivityAt)) / 1000));
  el.textContent = remaining;
  document.getElementById('idle-note').classList.toggle('warn', remaining <= 60);
}

function markActivity() {
  lastActivityAt = Date.now();
  updateIdleCountdown();
}

function startIdleTimer() {
  markActivity();
  IDLE_EVENTS.forEach((e) => document.addEventListener(e, markActivity));
  if (idleCheckInterval) clearInterval(idleCheckInterval);
  idleCheckInterval = setInterval(() => {
    updateIdleCountdown();
    if (Date.now() - lastActivityAt > IDLE_LIMIT_MS) {
      logout('閒置超過 5 分鐘，已自動登出，請重新登入');
    }
  }, 1000);
}

function stopIdleTimer() {
  if (idleCheckInterval) clearInterval(idleCheckInterval);
  idleCheckInterval = null;
  IDLE_EVENTS.forEach((e) => document.removeEventListener(e, markActivity));
}

async function login() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const msg = document.getElementById('login-msg');
  msg.textContent = '';

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();

  if (res.ok) {
    document.getElementById('login-password').value = '';
    showApp(data.username || username);
  } else {
    msg.textContent = data.error || '登入失敗';
    msg.className = 'msg error';
  }
}

async function logout(message) {
  await fetch('/api/logout', { method: 'POST' });
  closeShareModal();
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('old-password').value = '';
  document.getElementById('new-password').value = '';
  document.getElementById('new-password2').value = '';
  showLogin(typeof message === 'string' ? message : '');
}

async function changePassword() {
  const oldPassword = document.getElementById('old-password').value;
  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('new-password2').value;
  const msg = document.getElementById('change-password-msg');
  msg.textContent = '';

  if (newPassword !== confirmPassword) {
    msg.textContent = '兩次輸入的新密碼不一致';
    msg.className = 'msg error';
    return;
  }

  const res = await fetch('/api/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ oldPassword, newPassword })
  });

  if (res.status === 401 && !(await peekIsPasswordError(res))) return;

  const data = await res.json();

  if (res.ok) {
    msg.textContent = '密碼已更新，下次請用新密碼登入';
    msg.className = 'msg ok';
    document.getElementById('old-password').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-password2').value = '';
  } else {
    msg.textContent = data.error || '變更失敗';
    msg.className = 'msg error';
  }
}

// 401 可能是「舊密碼錯」也可能是「session 過期」，兩者要分開處理：
// 前者留在畫面上顯示錯誤，後者直接把使用者踢回登入畫面。
async function peekIsPasswordError(res) {
  const clone = res.clone();
  const data = await clone.json().catch(() => ({}));
  if (data.error === '請先登入') {
    showLogin('登入已過期，請重新登入');
    return false;
  }
  return true;
}

async function uploadFile() {
  const input = document.getElementById('file-input');
  const msg = document.getElementById('upload-msg');
  msg.textContent = '';

  if (!input.files.length) {
    msg.textContent = '請先選擇檔案';
    msg.className = 'msg error';
    return;
  }

  const file = input.files[0];
  const reader = new FileReader();

  reader.onload = async () => {
    const base64 = reader.result.split(',')[1];

    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, contentBase64: base64 })
    });
    const data = await res.json();

    if (res.ok) {
      msg.textContent = '上傳成功';
      msg.className = 'msg ok';
      input.value = '';
      loadFiles();
    } else {
      msg.textContent = data.error || '上傳失敗，請重新登入';
      msg.className = 'msg error';
    }
  };
  reader.readAsDataURL(file);
}

async function loadFiles() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    showLogin('登入已過期，請重新登入');
    return;
  }
  const data = await res.json();
  const list = document.getElementById('file-list');
  list.innerHTML = '';

  if (!data.files.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '目前沒有檔案，用上面的表單上傳第一個檔案。';
    list.appendChild(li);
    return;
  }

  data.files.forEach((f) => {
    const li = document.createElement('li');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'filename';
    nameSpan.textContent = f.filename;
    li.appendChild(nameSpan);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = '下載';
    downloadBtn.onclick = () => downloadFile(f.id, f.filename);
    actions.appendChild(downloadBtn);

    const shareBtn = document.createElement('button');
    shareBtn.className = 'outline';
    shareBtn.textContent = '分享';
    shareBtn.onclick = () => shareFile(f.id);
    actions.appendChild(shareBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'danger';
    deleteBtn.textContent = '刪除';
    deleteBtn.onclick = () => deleteFile(f.id);
    actions.appendChild(deleteBtn);

    li.appendChild(actions);
    list.appendChild(li);
  });
}

async function shareFile(id) {
  const res = await fetch('/api/share', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const data = await res.json();

  if (!res.ok) {
    alert(data.error || '產生分享連結失敗');
    return;
  }

  const input = document.getElementById('share-link-input');
  input.value = data.url;

  const expireMsg = document.getElementById('share-expire-msg');
  expireMsg.textContent = `此連結將於 ${new Date(data.expiresAt).toLocaleString()} 失效`;
  expireMsg.className = 'msg';

  document.getElementById('share-modal').classList.add('show');
  input.select();
}

function closeShareModal() {
  document.getElementById('share-modal').classList.remove('show');
}

function copyShareLink() {
  const input = document.getElementById('share-link-input');
  input.select();

  const showCopied = () => {
    const msg = document.getElementById('share-expire-msg');
    const base = msg.textContent.replace(/^已複製到剪貼簿！\s*/, '');
    msg.textContent = '已複製到剪貼簿！' + base;
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(input.value).then(showCopied).catch(() => {
      document.execCommand('copy');
      showCopied();
    });
  } else {
    document.execCommand('copy');
    showCopied();
  }
}

async function deleteFile(id) {
  if (!confirm('確定要刪除這個檔案嗎？此動作無法復原。')) return;

  const res = await fetch('/api/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const data = await res.json();

  if (!res.ok) {
    alert(data.error || '刪除失敗');
    return;
  }

  loadFiles();
}

async function downloadFile(id, filename) {
  const res = await fetch(`/api/download?id=${id}`);
  if (!res.ok) return alert('下載失敗');
  const data = await res.json();

  const link = document.createElement('a');
  link.href = `data:application/octet-stream;base64,${data.contentBase64}`;
  link.download = data.filename || filename;
  link.click();
}

// 頁面載入時確認是否已經有有效 session，有的話直接進入主畫面
(async () => {
  const res = await fetch('/api/me');
  if (res.ok) {
    const me = await res.json();
    showApp(me.username);
  }
})();
</script>

</body>
</html>
